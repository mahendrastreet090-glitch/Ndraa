<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stempel LUNAS Generator - Ndra09 API</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-grid {
      background-size: 20px 20px;
      background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 bg-grid">

  <!-- Header -->
  <header class="w-full max-w-2xl text-center py-6">
    <h1 class="text-3xl font-extrabold text-red-500 tracking-wide uppercase">Stempel LUNAS Generator</h1>
    <p class="text-slate-400 text-sm mt-1">Buat bukti pembayaran otomatis menggunakan Canvas API</p>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-2xl bg-slate-800/90 backdrop-blur border border-slate-700 rounded-2xl p-6 shadow-2xl my-auto">
    
    <form id="lunasForm" class="space-y-5">
      <!-- File Upload Area -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Upload Bukti Pembayaran / Gambar</label>
        <div class="flex items-center justify-center w-full">
          <label for="imageInput" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-slate-600 rounded-xl cursor-pointer bg-slate-900/50 hover:bg-slate-700/50 hover:border-red-500 transition-all group">
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
              <svg class="w-10 h-10 mb-3 text-slate-400 group-hover:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
              </svg>
              <p class="mb-1 text-sm text-slate-300"><span class="font-semibold">Klik untuk memilih</span> atau seret file ke sini</p>
              <p class="text-xs text-slate-500">PNG, JPG, JPEG, atau WEBP</p>
            </div>
            <input id="imageInput" type="file" accept="image/*" class="hidden" required />
          </label>
        </div>
        <p id="fileName" class="text-xs text-emerald-400 mt-2 hidden"></p>
      </div>

      <!-- Text Input -->
      <div>
        <label for="textInput" class="block text-sm font-medium text-slate-300 mb-1">Teks Stempel (Opsional)</label>
        <input type="text" id="textInput" placeholder="LUNAS" value="LUNAS" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 text-sm">
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition-all flex items-center justify-center gap-2 shadow-lg shadow-red-600/30">
        <span>Proses Gambar</span>
      </button>
    </form>

    <!-- Error Alert -->
    <div id="errorBox" class="mt-4 p-3 bg-red-900/50 border border-red-500 text-red-200 text-sm rounded-lg hidden"></div>

    <!-- Result Area -->
    <div id="resultBox" class="mt-6 pt-6 border-t border-slate-700 hidden">
      <h2 class="text-lg font-bold text-slate-200 mb-3 text-center">Hasil Stempel</h2>
      <div class="flex flex-col items-center gap-4">
        <div class="relative max-h-96 overflow-hidden rounded-lg border border-slate-700 shadow-md">
          <img id="resultImage" class="max-h-96 object-contain" alt="Hasil Stempel">
        </div>
        <a id="downloadBtn" download="lunas-result.jpg" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-6 py-2.5 rounded-lg transition-all flex items-center gap-2 shadow-lg shadow-emerald-600/30">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
          </svg>
          Download Gambar
        </a>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-2xl text-center py-4 text-xs text-slate-500">
    &copy; 2026 Ndra09 API. Powered by Vercel & Canvas.
  </footer>

  <script>
    const imageInput = document.getElementById('imageInput');
    const textInput = document.getElementById('textInput');
    const fileName = document.getElementById('fileName');
    const lunasForm = document.getElementById('lunasForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');
    const resultBox = document.getElementById('resultBox');
    const resultImage = document.getElementById('resultImage');
    const downloadBtn = document.getElementById('downloadBtn');

    // Tampilkan nama file yang dipilih
    imageInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        fileName.textContent = `File terpilih: ${e.target.files[0].name}`;
        fileName.classList.remove('hidden');
      }
    });

    // Handle Form Submit
    lunasForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const file = imageInput.files[0];
      if (!file) return;

      const customText = textInput.value.trim() || "LUNAS";

      // Reset State
      errorBox.classList.add('hidden');
      resultBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Memproses Gambar...</span>
      `;

      try {
        // Konversi Gambar ke Base64 (tanpa prefix data:image/...)
        const base64Data = await fileToBase64(file);

        // Kirim HTTP POST ke Vercel Serverless Function
        const response = await fetch('/api/lunas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            base64: base64Data,
            text: customText
          })
        });

        const data = await response.json();

        if (!response.ok || !data.status) {
          throw new Error(data.error || 'Terjadi kesalahan saat memproses gambar.');
        }

        // Tampilkan Hasil
        const outputImageSrc = `data:image/jpeg;base64,${data.result.base64}`;
        resultImage.src = outputImageSrc;
        downloadBtn.href = outputImageSrc;
        resultBox.classList.remove('hidden');

      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Proses Gambar</span>`;
      }
    });

    // Helper: Mengubah File Object ke Base64 murni
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
          // Menghapus 'data:image/png;base64,' awal agar murni string base64
          const base64String = reader.result.split(',')[1];
          resolve(base64String);
        };
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
